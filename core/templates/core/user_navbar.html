</head>
<style>
    body {
        font-family: 'Poppins', sans-serif;
        background: linear-gradient(135deg, #fff1f7, #f1f5ff);
        min-height: 100vh;
        overflow-x: hidden;
    }


    .navbar {
        background: rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(10px);
        border-radius: 0 0 20px 20px;
    }

    .nav-link {
        color: #444;
    }

    .nav-link:hover {
        color: #7b8cff;
    }

    .soft-btn {
        border-radius: 30px;
        padding: 10px 22px;
        font-weight: 600;
    }

    .gradient-text {
        background: linear-gradient(90deg, #813f11, #ffb347);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }
</style>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-light fixed-top py-3 navbar-glass">
  <div class="container">

    <!-- Logo -->
    <a class="navbar-brand fw-bold fs-4 gradient-text" href="/">
      MoodiBite
    </a>

    <!-- Mobile Hamburger -->
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
        data-bs-target="#navbarContent">
        <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Navbar Links -->
    <div class="collapse navbar-collapse justify-content-end" id="navbarContent">

      <ul class="navbar-nav align-items-center">

        <li class="nav-item">
          <a class="nav-link fw-semibold" href="{% url 'log_mood' %}">
            Log Mood
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link fw-semibold" href="{% url 'food_suggestions' %}">
            Food Recommendations
          </a>
        </li>

        <!-- Profile Dropdown -->
        <li class="nav-item dropdown ms-3">

          <a class="nav-link dropdown-toggle" href="#" role="button"
             data-bs-toggle="dropdown">

            {% if request.user.profile_picture %}
            <img class="rounded-circle" width="35"
                 src="{{request.user.profile_picture.url}}">
            {% else %}
            <img class="rounded-circle" width="35"
                 src="/static/assets/img/gallery/default-user.jpg">
            {% endif %}

          </a>

          <ul class="dropdown-menu dropdown-menu-end">

            {% if user.is_authenticated %}

            <li>
              <a class="dropdown-item" href="{% url 'user_profile' %}">
                View Profile
              </a>
            </li>

            <li>
              <a class="dropdown-item text-danger" href="{% url 'sign-out' %}">
                Logout
              </a>
            </li>

            {% else %}

            <li>
              <a class="dropdown-item" href="{% url 'sign-in' %}">
                Sign In
              </a>
            </li>

            {% endif %}

          </ul>

        </li>

      </ul>

    </div>

  </div>
</nav>
</body>
