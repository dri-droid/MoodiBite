  <link href="/static/assets/css/user.min.css" type="text/css" rel="stylesheet" id="user-style-default">
  <script>
    var phoenixIsRTL = window.config.config.phoenixIsRTL;
    if (phoenixIsRTL) {
      var linkDefault = document.getElementById('style-default');
      var userLinkDefault = document.getElementById('user-style-default');
      linkDefault.setAttribute('disabled', true);
      userLinkDefault.setAttribute('disabled', true);
      document.querySelector('html').setAttribute('dir', 'rtl');
    } else {
      var linkRTL = document.getElementById('style-rtl');
      var userLinkRTL = document.getElementById('user-style-rtl');
      linkRTL.setAttribute('disabled', true);
      userLinkRTL.setAttribute('disabled', true);
    }
  </script>
  <style>
    body {
  background: linear-gradient(135deg, #f6efe7, #efe3d6);
}
.auth-card {
  background: #ffffff;
  border-radius: 26px;
  box-shadow: 0 22px 50px rgba(0, 0, 0, 0.12);
  padding: 2.5rem 2.2rem;
}

.auth-title {
  color: #3b2a20;
  font-weight: 800;
}

.auth-subtitle {
  color: #7a665a;
  font-size: 0.95rem;
}

.form-control {
  border-radius: 14px;
  border: 1px solid #d8cfc6;
  padding: 12px 14px;
}

.form-control:focus {
  border-color: #6f4e37;
  box-shadow: 0 0 0 0.15rem rgba(111, 78, 55, 0.25);
}

.form-icon {
  color: #8a6d5a;
}

.btn-moodibite {
  background: #6f4e37;
  border: none;
  border-radius: 30px;
  padding: 12px;
  font-weight: 600;
  color: white;
}

.btn-moodibite:hover {
  background: #5a3d2b;
}

.auth-link {
  color: #6f4e37;
}

.auth-link:hover {
  color: #5a3d2b;
  text-decoration: underline;
}
  </style>

<body>
  <!-- ===============================================-->
  <!--    Main Content-->
  <!-- ===============================================-->
  <main class="main" id="top">
    <div class="container">
      <div class="row flex-center min-vh-100 py-5">
        <div class="col-sm-10 col-md-8 col-lg-5 col-xl-5 col-xxl-3"><a
            class="d-flex flex-center text-decoration-none mb-4" href="/static/index.html">
            <div class="d-flex align-items-center fw-bolder fs-3 d-inline-block"><img
                src="/static/assets/img/icons/logo-m.png" style="mix-blend-mode: multiply;" alt="phoenix" width="130" />
            </div>
          </a>
          <div class="auth-card text-center mb-7">
            <h3 class="auth-title text-body-highlight">Sign Up</h3>
            <p class="auth-subtitle text-body-tertiary">Create your account today</p>
          <hr class="bg-body-secondary mt-5 mb-4" />
          <form method="post">
            {%csrf_token%}
            <div class="mb-3 text-start"><label class="form-label" for="name">Username</label>
              <input class="form-control"id="name" type="text" name="username" placeholder="Name" /></div>
            <div class="mb-3 text-start"><label class="form-label" for="email">Email address</label>
              <input class="form-control" id="email" type="email" name="email" placeholder="name@example.com" /></div>
            <div class="row g-3 mb-3">
              <div class="col-sm-6"><label class="form-label" for="password">Password</label>
                <div class="position-relative" data-password="data-password">
                  <input class="form-control form-icon-input pe-6" name="password" id="password" type="password" placeholder="Password"
                    data-password-input="data-password-input" /><button
                    class="btn px-3 py-0 h-100 position-absolute top-0 end-0 fs-7 text-body-tertiary"
                    data-password-toggle="data-password-toggle"><span class="uil uil-eye show"></span><span
                      class="uil uil-eye-slash hide"></span></button></div>
              </div>
              <div class="col-sm-6"><label class="form-label" for="confirmPassword">Confirm Password</label>
                <div class="position-relative" data-password="data-password">
                  <input class="form-control form-icon-input pe-6" name="password2" id="confirmPassword" type="password"
                    placeholder="Confirm Password" data-password-input="data-password-input" /><button
                    class="btn px-3 py-0 h-100 position-absolute top-0 end-0 fs-7 text-body-tertiary"
                    data-password-toggle="data-password-toggle"><span class="uil uil-eye show"></span><span
                      class="uil uil-eye-slash hide"></span></button></div>
              </div>
            </div>
            <button type="submit" class="btn btn-moodibite w-100 mb-3">Sign up</button>
            <div class="text-center"><a class="fs-9 fw-bold auth-link" href="{%url 'sign-in' %}">Sign in to an
                existing account</a></div>
          </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="/static/vendors/popper/popper.min.js"></script>

  <script src="/static/vendors/list.js/list.min.js"></script>
  <script src="/static/vendors/feather-icons/feather.min.js"></script>
  <script src="/static/vendors/dayjs/dayjs.min.js"></script>
  <script src="/static/assets/js/phoenix.js"></script>
</body>
